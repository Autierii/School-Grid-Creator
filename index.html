<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Grades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #0b0710; color: #e2e8f0; }
        .fade-in { animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #130c1a; }
        ::-webkit-scrollbar-thumb { background: #3b2559; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #563782; }
        .draggable-cell { cursor: grab; }
        .draggable-cell:active { cursor: grabbing; }
        .drag-over { background-color: rgba(126, 34, 206, 0.2) !important; outline: 1px solid #9333ea; }
        input, select, textarea { transition: border-color 0.15s ease-in-out; }
        @media print {
            body { background-color: white !important; color: black !important; }
            .no-print { display: none !important; }
            .print-bg-dark { background-color: #f8fafc !important; color: black !important; border: 1px solid #e2e8f0; }
            .print-text-dark { color: black !important; }
            .print-border { border: 1px solid #cbd5e1 !important; }
            * { text-shadow: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-[#0b0710] min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;
        const DIAS = ["Segunda", "Terça", "Quarta", "Quinta", "Sexta"];

        function App() {
            const [step, setStep] = useState(1);
            
            const [numAulasDia, setNumAulasDia] = useState(3);
            const [horarios, setHorarios] = useState(["8h", "10h", "14h"]);
            const [materias, setMaterias] = useState([]);
            
            const [grade, setGrade] = useState(null);
            const [turmasDisponiveis, setTurmasDisponiveis] = useState([]);
            const [erroGeracao, setErroGeracao] = useState("");
            const [isGenerating, setIsGenerating] = useState(false);
            
            const [draggedItem, setDraggedItem] = useState(null);
            const [dragOverItem, setDragOverItem] = useState(null);

            // Settings State
            const [cohereKey, setCohereKey] = useState(localStorage.getItem('cohereKey') || "");
            const [isAiConfigOpen, setIsAiConfigOpen] = useState(false);
            const [isAiInputOpen, setIsAiInputOpen] = useState(false);
            const [aiLoading, setAiLoading] = useState(false);
            const [aiStatus, setAiStatus] = useState("");
            const [aiText, setAiText] = useState("");
            const [apiLimits, setApiLimits] = useState(null);
            const fileInputRef = useRef(null);
            const jsonFileInputRef = useRef(null);

            React.useEffect(() => {
                if (materias && materias.length > 0) {
                    localStorage.setItem('grid_creator_auto_backup', JSON.stringify({ numAulasDia, horarios, materias }));
                }
            }, [materias, horarios, numAulasDia]);

            const saveKey = (key) => {
                setCohereKey(key);
                localStorage.setItem('cohereKey', key);
            };

            const updateHorario = (index, value) => {
                const newHorarios = [...horarios];
                newHorarios[index] = value;
                setHorarios(newHorarios);
            };

            const changeNumAulas = (val) => {
                const n = parseInt(val) || 1;
                setNumAulasDia(n);
                if (n > horarios.length) {
                    setHorarios([...horarios, ...Array(n - horarios.length).fill("")]);
                } else if (n < horarios.length) {
                    setHorarios(horarios.slice(0, n));
                }
            };

            const addMateria = () => setMaterias([...materias, { id: Date.now(), sigla: "", professores: [] }]);
            const updateMateria = (index, sigla) => {
                const newMaterias = [...materias];
                newMaterias[index].sigla = sigla.toUpperCase();
                setMaterias(newMaterias);
            };
            const removeMateria = (index) => setMaterias(materias.filter((_, i) => i !== index));

            const addProfessor = (materiaIndex) => {
                const newMaterias = [...materias];
                newMaterias[materiaIndex].professores.push({ id: Date.now(), nome: "", turmas: [], indisponibilidades: [] });
                setMaterias(newMaterias);
            };
            const updateProfessor = (materiaIndex, profIndex, nome) => {
                const newMaterias = [...materias];
                newMaterias[materiaIndex].professores[profIndex].nome = nome;
                setMaterias(newMaterias);
            };
            const removeProfessor = (materiaIndex, profIndex) => {
                const newMaterias = [...materias];
                newMaterias[materiaIndex].professores = newMaterias[materiaIndex].professores.filter((_, i) => i !== profIndex);
                setMaterias(newMaterias);
            };

            const addTurmaAoProfessor = (materiaIndex, profIndex) => {
                const newMaterias = [...materias];
                newMaterias[materiaIndex].professores[profIndex].turmas.push({ id: Date.now(), nome: "", aulas: 1 });
                setMaterias(newMaterias);
            };
            const updateTurma = (materiaIndex, profIndex, turmaIndex, field, value) => {
                const newMaterias = [...materias];
                if (field === 'nome') value = value.toUpperCase();
                newMaterias[materiaIndex].professores[profIndex].turmas[turmaIndex][field] = value;
                setMaterias(newMaterias);
            };
            const removeTurma = (materiaIndex, profIndex, turmaIndex) => {
                const newMaterias = [...materias];
                newMaterias[materiaIndex].professores[profIndex].turmas = newMaterias[materiaIndex].professores[profIndex].turmas.filter((_, i) => i !== turmaIndex);
                setMaterias(newMaterias);
            };

            const addIndisponibilidade = (materiaIndex, profIndex) => {
                const newMaterias = [...materias];
                newMaterias[materiaIndex].professores[profIndex].indisponibilidades.push({ id: Date.now(), dia: "Segunda", hora: horarios[0] || "" });
                setMaterias(newMaterias);
            };
            const updateIndisponibilidade = (materiaIndex, profIndex, indispIndex, field, value) => {
                const newMaterias = [...materias];
                newMaterias[materiaIndex].professores[profIndex].indisponibilidades[indispIndex][field] = value;
                setMaterias(newMaterias);
            };
            const removeIndisponibilidade = (materiaIndex, profIndex, indispIndex) => {
                const newMaterias = [...materias];
                newMaterias[materiaIndex].professores[profIndex].indisponibilidades = newMaterias[materiaIndex].professores[profIndex].indisponibilidades.filter((_, i) => i !== indispIndex);
                setMaterias(newMaterias);
            };

            const salvarConfiguracao = () => {
                const dataToSave = {
                    numAulasDia,
                    horarios,
                    materias
                };
                localStorage.setItem('grid_creator_saved_state', JSON.stringify(dataToSave));
                alert("Configuração e demandas salvas com sucesso no navegador!");
            };

            const carregarConfiguracao = () => {
                const saved = localStorage.getItem('grid_creator_saved_state');
                if (!saved) {
                    alert("Nenhuma configuração salva anteriormente foi encontrada.");
                    return;
                }
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.numAulasDia) setNumAulasDia(parsed.numAulasDia);
                    if (parsed.horarios) setHorarios(parsed.horarios);
                    if (parsed.materias) setMaterias(parsed.materias);
                    setStep(2);
                    alert("Configuração anterior restaurada com sucesso!");
                } catch (e) {
                    alert("Erro ao carregar dados salvos: " + e.message);
                }
            };

            const exportarConfiguracaoJSON = () => {
                const dataToSave = {
                    numAulasDia,
                    horarios,
                    materias
                };
                const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'configuracao_escola.json';
                a.click();
            };

            const importarConfiguracaoJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (parsed.numAulasDia) setNumAulasDia(parsed.numAulasDia);
                        if (parsed.horarios) setHorarios(parsed.horarios);
                        if (parsed.materias) setMaterias(parsed.materias);
                        setStep(2);
                        alert("Arquivo JSON de configuração carregado com sucesso!");
                    } catch (err) {
                        alert("Erro ao ler arquivo JSON: " + err.message);
                    }
                };
                reader.readAsText(file);
            };

            const gerarGrade = async () => {
                setIsGenerating(true);
                setErroGeracao("");
                
                await new Promise(r => setTimeout(r, 50));
                
                const success = await resolverGrade();
                setIsGenerating(false);
                if (success) {
                    setStep(3);
                }
            };

            const resolverGrade = async () => {
                const turmasSet = new Set();
                let requirements = [];
                let indispMap = {};
                let requiredHoursCount = 0;

                materias.forEach(mat => {
                    mat.professores.forEach(prof => {
                        if (!indispMap[prof.nome]) indispMap[prof.nome] = new Set();
                        prof.indisponibilidades.forEach(ind => {
                            if(ind.dia && ind.hora) indispMap[prof.nome].add(`${ind.dia}-${ind.hora}`);
                        });
                        
                        prof.turmas.forEach(turma => {
                            if (!turma.nome || parseInt(turma.aulas) <= 0) return;
                            turmasSet.add(turma.nome);
                            requirements.push({ mat: mat.sigla, prof: prof.nome, turma: turma.nome, total: parseInt(turma.aulas) });
                            requiredHoursCount += parseInt(turma.aulas);
                        });
                    });
                });

                const turmasList = Array.from(turmasSet);
                setTurmasDisponiveis(turmasList);

                const slotsPerTurma = DIAS.length * horarios.length;
                const maxCapacity = turmasList.length * slotsPerTurma;
                if (requiredHoursCount > maxCapacity) {
                    setErroGeracao(`Capacidade excedida. Exigido: ${requiredHoursCount} aulas. Capacidade máxima: ${maxCapacity}.`);
                    return false;
                }
                
                for (let t of turmasList) {
                    const reqsTurma = requirements.filter(r => r.turma === t).reduce((sum, r) => sum + r.total, 0);
                    if (reqsTurma > slotsPerTurma) {
                        setErroGeracao(`Conflito: A turma ${t} exige ${reqsTurma} aulas, mas o quadro semanal possui apenas ${slotsPerTurma} horários disponíveis.`);
                        return false;
                    }
                }

                // Cria instâncias individuais de cada aula
                const classItems = [];
                requirements.forEach((r, rIdx) => {
                    for (let i = 0; i < r.total; i++) {
                        classItems.push({
                            id: classItems.length,
                            turma: r.turma,
                            prof: r.prof,
                            mat: r.mat
                        });
                    }
                });

                // Cria coordenadas dos slots semanais
                const allSlots = [];
                DIAS.forEach(d => {
                    horarios.forEach(h => {
                        allSlots.push({ d, h });
                    });
                });

                // Agrupa as aulas por turma e preenche com vago se necessário
                const turmaClasses = {};
                turmasList.forEach(t => {
                    const items = classItems.filter(c => c.turma === t);
                    while (items.length < slotsPerTurma) {
                        items.push({ id: -1, turma: t, prof: "", mat: "—" });
                    }
                    turmaClasses[t] = items;
                });

                // Funções de avaliação de conflitos
                function getSlotConflicts(timetable, sIdx) {
                    const slot = allSlots[sIdx];
                    let conf = 0;
                    const profsInSlot = new Set();
                    for (let t of turmasList) {
                        const c = timetable[t][sIdx];
                        if (c && c.id !== -1) {
                            if (profsInSlot.has(c.prof)) {
                                conf += 20; // Penalidade choque de professor no mesmo horário
                            } else {
                                profsInSlot.add(c.prof);
                            }
                            if (indispMap[c.prof] && indispMap[c.prof].has(`${slot.d}-${slot.h}`)) {
                                conf += 20; // Penalidade professor alocado em horário bloqueado
                            }
                        }
                    }
                    return conf;
                }

                function getTurmaDayConflicts(timetable, t, dIdx) {
                    const subjectCounts = {};
                    let conf = 0;
                    for (let hIdx = 0; hIdx < horarios.length; hIdx++) {
                        const sIdx = dIdx * horarios.length + hIdx;
                        const c = timetable[t][sIdx];
                        if (c && c.id !== -1) {
                            subjectCounts[c.mat] = (subjectCounts[c.mat] || 0) + 1;
                            if (subjectCounts[c.mat] > 2) {
                                conf += 2; // Penalidade mais de 2 aulas da mesma matéria no mesmo dia
                            }
                        }
                    }
                    return conf;
                }

                function countTotalConflicts(timetable) {
                    let total = 0;
                    for (let s = 0; s < slotsPerTurma; s++) {
                        total += getSlotConflicts(timetable, s);
                    }
                    for (let t of turmasList) {
                        for (let d = 0; d < DIAS.length; d++) {
                            total += getTurmaDayConflicts(timetable, t, d);
                        }
                    }
                    return total;
                }

                // Otimização Estocástica (Simulated Annealing + Min-Conflicts)
                let solvedTimetable = null;
                const NUM_RESTARTS = 80;
                const ITERS_PER_RESTART = 5000;
                let lastYield = Date.now();

                for (let restart = 0; restart < NUM_RESTARTS; restart++) {
                    let currentTimetable = {};
                    turmasList.forEach(t => {
                        const items = [...turmaClasses[t]];
                        // Embaralha slots da turma
                        for (let i = items.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [items[i], items[j]] = [items[j], items[i]];
                        }
                        currentTimetable[t] = items;
                    });

                    let currentConflicts = countTotalConflicts(currentTimetable);
                    if (currentConflicts === 0) {
                        solvedTimetable = currentTimetable;
                        break;
                    }

                    let temp = 15.0;

                    for (let iter = 0; iter < ITERS_PER_RESTART; iter++) {
                        if (Date.now() - lastYield > 20) {
                            await new Promise(r => setTimeout(r, 0));
                            lastYield = Date.now();
                        }

                        const t = turmasList[Math.floor(Math.random() * turmasList.length)];
                        const s1 = Math.floor(Math.random() * slotsPerTurma);
                        const s2 = Math.floor(Math.random() * slotsPerTurma);
                        if (s1 === s2) continue;

                        const d1 = Math.floor(s1 / horarios.length);
                        const d2 = Math.floor(s2 / horarios.length);

                        const oldConf = getSlotConflicts(currentTimetable, s1) + 
                                       getSlotConflicts(currentTimetable, s2) + 
                                       getTurmaDayConflicts(currentTimetable, t, d1) + 
                                       (d1 !== d2 ? getTurmaDayConflicts(currentTimetable, t, d2) : 0);

                        // Troca de posição
                        const tempC = currentTimetable[t][s1];
                        currentTimetable[t][s1] = currentTimetable[t][s2];
                        currentTimetable[t][s2] = tempC;

                        const newConf = getSlotConflicts(currentTimetable, s1) + 
                                       getSlotConflicts(currentTimetable, s2) + 
                                       getTurmaDayConflicts(currentTimetable, t, d1) + 
                                       (d1 !== d2 ? getTurmaDayConflicts(currentTimetable, t, d2) : 0);

                        const delta = newConf - oldConf;

                        if (delta <= 0 || Math.random() < Math.exp(-delta / temp)) {
                            currentConflicts += delta;
                            if (currentConflicts === 0) {
                                solvedTimetable = currentTimetable;
                                break;
                            }
                        } else {
                            // Reverte a troca
                            currentTimetable[t][s2] = currentTimetable[t][s1];
                            currentTimetable[t][s1] = tempC;
                        }

                        temp *= 0.9992;
                    }

                    if (solvedTimetable) break;
                }

                if (!solvedTimetable) {
                    setErroGeracao("Aviso: Não foi possível fechar uma grade com 0 choques com essas restrições. Verifique se os bloqueios de professores deixam horários livres suficientes.");
                    return false;
                }

                let newGrade = {};
                turmasList.forEach(t => {
                    newGrade[t] = {};
                    DIAS.forEach((d, dIdx) => {
                        newGrade[t][d] = {};
                        horarios.forEach((h, hIdx) => {
                            const sIdx = dIdx * horarios.length + hIdx;
                            const c = solvedTimetable[t][sIdx];
                            newGrade[t][d][h] = (c && c.id !== -1 && c.mat !== "—") ? `${c.mat} (${c.prof})` : "—";
                        });
                    });
                });

                setGrade(newGrade);
                return true;
            };

            const callCohere = async (promptMsg) => {
                if (!cohereKey) {
                    alert("A chave da API é necessária para utilizar os recursos automatizados.");
                    setIsAiConfigOpen(true);
                    return null;
                }
                try {
                    const response = await fetch('https://api.cohere.ai/v2/chat', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${cohereKey}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            model: "command-r-08-2024",
                            messages: [{ role: "user", content: promptMsg }],
                            temperature: 0.1,
                            response_format: { type: "json_object" },
                            max_tokens: 4000
                        })
                    });
                    
                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.message || "Falha de comunicação com a API.");
                    }
                    
                    let remaining = parseInt(response.headers.get('x-ratelimit-remaining'));
                    let limit = parseInt(response.headers.get('x-ratelimit-limit'));
                    
                    const data = await response.json();
                    
                    if (isNaN(limit) || limit <= 0) limit = 40;
                    if (isNaN(remaining)) {
                        remaining = apiLimits && typeof apiLimits.remaining === 'number' ? Math.max(0, apiLimits.remaining - 1) : 39;
                    }
                    const pct = Math.max(0, Math.min(100, Math.round((remaining / limit) * 100)));
                    
                    setApiLimits({
                        remaining,
                        limit,
                        percent: pct,
                        tokensUsed: data.usage?.tokens?.output_tokens || 0
                    });

                    const textObj = data.message?.content?.find(c => c.type === 'text');
                    return textObj ? textObj.text : "";
                } catch (e) {
                    alert("Ocorreu um erro ao processar a requisição: " + e.message);
                    return null;
                }
            };

            const cleanJsonString = (str) => {
                return str.replace(/,\s*([\}\]])/g, '$1');
            };

            const repairTruncatedJson = (jsonStr) => {
                if (!jsonStr || typeof jsonStr !== 'string') return null;
                let s = jsonStr.trim();
                const firstBrace = s.indexOf('{');
                const firstBracket = s.indexOf('[');
                let startIdx = 0;
                if (firstBrace !== -1 && (firstBracket === -1 || firstBrace < firstBracket)) {
                    startIdx = firstBrace;
                } else if (firstBracket !== -1) {
                    startIdx = firstBracket;
                }
                s = s.substring(startIdx);
                
                let inString = false;
                let isEscaped = false;
                let stack = [];
                for (let i = 0; i < s.length; i++) {
                    const char = s[i];
                    if (isEscaped) { isEscaped = false; continue; }
                    if (char === '\\') { isEscaped = true; continue; }
                    if (char === '"') { inString = !inString; continue; }
                    if (!inString) {
                        if (char === '{' || char === '[') stack.push(char === '{' ? '}' : ']');
                        else if (char === '}' || char === ']') {
                            if (stack.length > 0 && stack[stack.length - 1] === char) stack.pop();
                        }
                    }
                }
                if (inString) s += '"';
                s = s.replace(/,\s*$/, '');
                while (stack.length > 0) {
                    s = s.replace(/,\s*$/, '');
                    s += stack.pop();
                }
                return s;
            };

            const extractJSON = (text) => {
                if (!text || typeof text !== 'string') return null;
                
                // 1. Markdown code blocks
                const codeBlockMatch = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
                if (codeBlockMatch) {
                    try { return JSON.parse(cleanJsonString(codeBlockMatch[1].trim())); } catch (e) {}
                }
                
                // 2. Direct parse
                try {
                    return JSON.parse(cleanJsonString(text.trim()));
                } catch (e) {}
                
                // 3. Outermost { ... }
                const firstBrace = text.indexOf('{');
                const lastBrace = text.lastIndexOf('}');
                if (firstBrace !== -1 && lastBrace > firstBrace) {
                    try {
                        return JSON.parse(cleanJsonString(text.substring(firstBrace, lastBrace + 1)));
                    } catch (e) {}
                }
                
                // 4. Outermost [ ... ]
                const firstBracket = text.indexOf('[');
                const lastBracket = text.lastIndexOf(']');
                if (firstBracket !== -1 && lastBracket > firstBracket) {
                    try {
                        return JSON.parse(cleanJsonString(text.substring(firstBracket, lastBracket + 1)));
                    } catch (e) {}
                }
                
                // 5. Auto repair for truncated outputs
                try {
                    const repaired = repairTruncatedJson(text);
                    if (repaired) return JSON.parse(cleanJsonString(repaired));
                } catch (e) {}

                return null;
            };

            const normalizeDay = (d) => {
                if (!d) return "Segunda";
                const str = String(d).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                if (str.includes("seg")) return "Segunda";
                if (str.includes("ter")) return "Terça";
                if (str.includes("qua")) return "Quarta";
                if (str.includes("qui")) return "Quinta";
                if (str.includes("sex")) return "Sexta";
                return "Segunda";
            };

            const normalizeHour = (h, horariosList) => {
                if (!horariosList || horariosList.length === 0) return h || "";
                if (horariosList.includes(h)) return h;
                
                const str = String(h).toLowerCase();
                if (str.includes("1") || str.includes("primeir")) return horariosList[0] || "";
                if (str.includes("2") || str.includes("segund")) return horariosList[1] || "";
                if (str.includes("3") || str.includes("terceir")) return horariosList[2] || "";
                if (str.includes("4") || str.includes("quart")) return horariosList[3] || "";
                if (str.includes("5") || str.includes("quint")) return horariosList[4] || "";
                if (str.includes("6") || str.includes("sext")) return horariosList[5] || "";
                
                for (let slot of horariosList) {
                    if (slot.toLowerCase().includes(str) || str.includes(slot.toLowerCase())) return slot;
                }
                return horariosList[0] || "";
            };

            const convertAnyJsonToMaterias = (json, parsedHorarios) => {
                if (!json) return null;
                
                // Schema A: por Matéria
                let rawMaterias = null;
                if (Array.isArray(json)) rawMaterias = json;
                else if (Array.isArray(json.materias)) rawMaterias = json.materias;
                else if (Array.isArray(json.disciplinas)) rawMaterias = json.disciplinas;
                else if (json.data && Array.isArray(json.data.materias)) rawMaterias = json.data.materias;
                else if (json.escola && Array.isArray(json.escola.materias)) rawMaterias = json.escola.materias;

                if (rawMaterias && rawMaterias.length > 0 && typeof rawMaterias[0] === 'object') {
                    return rawMaterias.map(m => {
                        const rawProfs = Array.isArray(m.professores) ? m.professores : (Array.isArray(m.docentes) ? m.docentes : []);
                        return {
                            id: Date.now() + Math.random(),
                            sigla: (m.sigla || m.nome || m.disciplina || "DISC").toUpperCase(),
                            professores: rawProfs.map(p => {
                                const rawTurmas = Array.isArray(p.turmas) ? p.turmas : (Array.isArray(p.classes) ? p.classes : []);
                                const rawIndisp = Array.isArray(p.indisponibilidades) ? p.indisponibilidades : (Array.isArray(p.restricoes) ? p.restricoes : []);
                                
                                const processedIndisp = [];
                                rawIndisp.forEach(ind => {
                                    const diaStr = String(ind.dia || "").toLowerCase();
                                    if (diaStr.includes("nenhum") || diaStr.includes("todo")) {
                                        DIAS.forEach(d => processedIndisp.push({ id: Date.now() + Math.random(), dia: d, hora: normalizeHour(ind.hora, parsedHorarios) }));
                                    } else {
                                        processedIndisp.push({ id: Date.now() + Math.random(), dia: normalizeDay(ind.dia), hora: normalizeHour(ind.hora, parsedHorarios) });
                                    }
                                });

                                return {
                                    id: Date.now() + Math.random(),
                                    nome: p.nome || p.professor || "Professor",
                                    turmas: rawTurmas.map(t => ({
                                        id: Date.now() + Math.random(),
                                        nome: (t.nome || t.turma || "TURMA").toUpperCase(),
                                        aulas: parseInt(t.aulas || t.quantidade || t.cargaHoraria || 1) || 1
                                    })),
                                    indisponibilidades: processedIndisp
                                };
                            })
                        };
                    });
                }

                // Schema B: por Professor
                let rawProfs = Array.isArray(json.professores) ? json.professores : (Array.isArray(json.docentes) ? json.docentes : null);
                if (rawProfs && rawProfs.length > 0) {
                    const materiasMap = {};
                    rawProfs.forEach(p => {
                        const profName = p.nome || p.professor || "Professor";
                        const rawIndisp = Array.isArray(p.indisponibilidades) ? p.indisponibilidades : (Array.isArray(p.restricoes) ? p.restricoes : []);
                        const processedIndisp = [];
                        rawIndisp.forEach(ind => {
                            const diaStr = String(ind.dia || "").toLowerCase();
                            if (diaStr.includes("nenhum") || diaStr.includes("todo")) {
                                DIAS.forEach(d => processedIndisp.push({ id: Date.now() + Math.random(), dia: d, hora: normalizeHour(ind.hora, parsedHorarios) }));
                            } else {
                                processedIndisp.push({ id: Date.now() + Math.random(), dia: normalizeDay(ind.dia), hora: normalizeHour(ind.hora, parsedHorarios) });
                            }
                        });

                        if (Array.isArray(p.materias)) {
                            p.materias.forEach(m => {
                                const sigla = (m.sigla || m.nome || m.disciplina || "DISC").toUpperCase();
                                if (!materiasMap[sigla]) materiasMap[sigla] = { id: Date.now() + Math.random(), sigla, professores: [] };
                                const rawTurmas = Array.isArray(m.turmas) ? m.turmas : (Array.isArray(p.turmas) ? p.turmas : []);
                                materiasMap[sigla].professores.push({
                                    id: Date.now() + Math.random(),
                                    nome: profName,
                                    turmas: rawTurmas.map(t => ({ id: Date.now() + Math.random(), nome: (t.nome || t.turma || "TURMA").toUpperCase(), aulas: parseInt(t.aulas || 1) })),
                                    indisponibilidades: processedIndisp
                                });
                            });
                        } else {
                            const sigla = (p.materia || p.disciplina || "DISC").toUpperCase();
                            if (!materiasMap[sigla]) materiasMap[sigla] = { id: Date.now() + Math.random(), sigla, professores: [] };
                            const rawTurmas = Array.isArray(p.turmas) ? p.turmas : [];
                            materiasMap[sigla].professores.push({
                                id: Date.now() + Math.random(),
                                nome: profName,
                                turmas: rawTurmas.map(t => ({ id: Date.now() + Math.random(), nome: (t.nome || t.turma || "TURMA").toUpperCase(), aulas: parseInt(t.aulas || 1) })),
                                indisponibilidades: processedIndisp
                            });
                        }
                    });
                    const res = Object.values(materiasMap);
                    if (res.length > 0) return res;
                }

                // Schema C: por Turma
                let rawTurmas = Array.isArray(json.turmas) ? json.turmas : (Array.isArray(json.classes) ? json.classes : null);
                if (rawTurmas && rawTurmas.length > 0) {
                    const materiasMap = {};
                    rawTurmas.forEach(t => {
                        const turmaName = (t.nome || t.turma || "TURMA").toUpperCase();
                        const tMaterias = Array.isArray(t.materias) ? t.materias : (Array.isArray(t.disciplinas) ? t.disciplinas : []);
                        tMaterias.forEach(m => {
                            const sigla = (m.sigla || m.nome || m.disciplina || "DISC").toUpperCase();
                            const profName = m.professor || m.docente || m.prof || "Professor";
                            const aulas = parseInt(m.aulas || m.quantidade || m.cargaHoraria || 1) || 1;
                            
                            if (!materiasMap[sigla]) materiasMap[sigla] = { id: Date.now() + Math.random(), sigla, profsMap: {} };
                            if (!materiasMap[sigla].profsMap[profName]) {
                                materiasMap[sigla].profsMap[profName] = {
                                    id: Date.now() + Math.random(),
                                    nome: profName,
                                    turmas: [],
                                    indisponibilidades: []
                                };
                            }
                            materiasMap[sigla].profsMap[profName].turmas.push({ id: Date.now() + Math.random(), nome: turmaName, aulas });
                        });
                    });

                    const res = Object.values(materiasMap).map(m => ({
                        id: m.id,
                        sigla: m.sigla,
                        professores: Object.values(m.profsMap)
                    }));
                    if (res.length > 0) return res;
                }

                return null;
            };

            const parseDirectText = (rawText) => {
                if (!rawText || typeof rawText !== 'string') return null;
                
                const hasTurmaBlocks = /\b\d+[A-Za-z]+\s*:\s*\n/i.test(rawText);
                const hasAssignPattern = /[A-Za-zÀ-ÖØ-öø-ÿ\s]+\s*\([^)]+\)\s*-\s*\d+/i.test(rawText);
                
                if (!hasTurmaBlocks || !hasAssignPattern) return null;

                // 1. Extrair Horários
                const horarioRegex = /(\d+)°[:\s]+(\d+h[^\n\r]*)/gi;
                let match;
                const horarios = [];
                while ((match = horarioRegex.exec(rawText)) !== null) {
                    let hText = match[2].trim();
                    if (!hText.toLowerCase().includes("intervalo")) {
                        horarios.push(hText);
                    }
                }
                const finalHorarios = horarios.length > 0 ? horarios : ["7h - 7h45", "7h45 - 8h30", "8h50 - 9h35", "9h35 - 10h20", "10h20 - 11h05", "11h05 - 11h50"];

                // 2. Extrair Indisponibilidades
                const indispMap = {};
                const restrSectionMatch = rawText.split(/restrições|restricoes/i);
                if (restrSectionMatch.length > 1) {
                    const restrText = restrSectionMatch[1];
                    const profBlocks = restrText.split(/\n\s*([A-Za-zÀ-ÖØ-öø-ÿ\s]+):\s*\n/);
                    
                    for (let i = 1; i < profBlocks.length; i += 2) {
                        const currentProf = profBlocks[i].trim();
                        const rulesText = profBlocks[i+1];
                        if (!indispMap[currentProf]) indispMap[currentProf] = [];
                        
                        const ruleLines = rulesText.split('\n');
                        for (let line of ruleLines) {
                            line = line.trim();
                            if (!line) continue;
                            const ruleMatch = line.match(/(\d+)°?\s*aula\s*-\s*(.+)/i);
                            if (ruleMatch) {
                                const aulaNum = parseInt(ruleMatch[1]);
                                const horaSlot = finalHorarios[aulaNum - 1] || `${aulaNum}ª Aula`;
                                const daysStr = ruleMatch[2].toLowerCase();
                                
                                if (daysStr.includes("nenhum") || daysStr.includes("todos")) {
                                    DIAS.forEach(d => indispMap[currentProf].push({ dia: d, hora: horaSlot }));
                                } else {
                                    if (daysStr.includes("segunda")) indispMap[currentProf].push({ dia: "Segunda", hora: horaSlot });
                                    if (daysStr.includes("terça") || daysStr.includes("terca")) indispMap[currentProf].push({ dia: "Terça", hora: horaSlot });
                                    if (daysStr.includes("quarta")) indispMap[currentProf].push({ dia: "Quarta", hora: horaSlot });
                                    if (daysStr.includes("quinta")) indispMap[currentProf].push({ dia: "Quinta", hora: horaSlot });
                                    if (daysStr.includes("sexta")) indispMap[currentProf].push({ dia: "Sexta", hora: horaSlot });
                                }
                            }
                        }
                    }
                }

                // 3. Extrair Turmas e Aulas
                const turmasSection = restrSectionMatch[0];
                const turmasBlocks = turmasSection.split(/\n\s*(\d+[A-Za-z]+):\s*\n/);
                const materiasMap = {};

                for (let i = 1; i < turmasBlocks.length; i += 2) {
                    const turmaName = turmasBlocks[i].trim().toUpperCase();
                    const assignmentsText = turmasBlocks[i+1];
                    
                    const assignLines = assignmentsText.split('\n');
                    for (let line of assignLines) {
                        line = line.trim();
                        if (!line) continue;
                        const assignMatch = line.match(/([A-Za-zÀ-ÖØ-öø-ÿ\s]+)\s*\(([^)]+)\)\s*-\s*(\d+)/);
                        if (assignMatch) {
                            const profName = assignMatch[1].trim();
                            const sigla = assignMatch[2].trim().toUpperCase();
                            const aulas = parseInt(assignMatch[3]);
                            
                            if (!materiasMap[sigla]) materiasMap[sigla] = { id: Date.now() + Math.random(), sigla, profs: {} };
                            if (!materiasMap[sigla].profs[profName]) {
                                materiasMap[sigla].profs[profName] = {
                                    id: Date.now() + Math.random(),
                                    nome: profName,
                                    turmas: [],
                                    indisponibilidades: indispMap[profName] || []
                                };
                            }
                            materiasMap[sigla].profs[profName].turmas.push({
                                id: Date.now() + Math.random(),
                                nome: turmaName,
                                aulas: aulas
                            });
                        }
                    }
                }

                const materiasList = Object.values(materiasMap).map(m => ({
                    id: m.id,
                    sigla: m.sigla,
                    professores: Object.values(m.profs)
                }));

                if (materiasList.length === 0) return null;

                return {
                    numAulasDia: finalHorarios.length,
                    horarios: finalHorarios,
                    materias: materiasList
                };
            };

            const handleGenerateFromData = async () => {
                if (!aiText) return;
                setAiLoading(true);
                setAiStatus("Analisando estruturas escolares...");
                
                // 1. Tenta primeiro o Parser Direto de Alta Precisão (Zero alucinações, sem duplicações)
                const directParsed = parseDirectText(aiText);
                if (directParsed && directParsed.materias.length > 0) {
                    setNumAulasDia(directParsed.numAulasDia);
                    setHorarios(directParsed.horarios);
                    setMaterias(directParsed.materias);
                    setStep(2);
                    setIsAiInputOpen(false);
                    setAiText("");
                    setAiLoading(false);
                    return;
                }

                // 2. Se for texto livre ou não padronizado, usa a IA da Cohere
                setAiStatus("Processando via Inteligência Artificial (Cohere)...");
                const prompt = `Você é um extrator de dados estruturados para um sistema escolar. Converta a entrada do usuário estritamente em um JSON.

REGRAS OBRIGATÓRIAS:
1. "numAulasDia": número total de aulas por dia (ignorar intervalos). Exemplo: 6.
2. "horarios": lista de strings com os horários de aula (Ex: ["7h - 7h45", "7h45 - 8h30", "8h50 - 9h35", "9h35 - 10h20", "10h20 - 11h05", "11h05 - 11h50"]).
3. "materias": lista de disciplinas. Para cada uma:
   - "sigla": nome ou sigla da matéria (Ex: "Port", "Mat", "Hist", etc)
   - "professores": lista de professores:
     - "nome": nome do professor (Ex: "Juliana")
     - "turmas": lista com turmas e quantidade de aulas semanais (Ex: [{"nome": "6A", "aulas": 5}, {"nome": "6B", "aulas": 5}])
     - "indisponibilidades": lista de horários bloqueados. O campo "hora" DEVE corresponder ao horário da lista "horarios". O campo "dia" deve ser "Segunda", "Terça", "Quarta", "Quinta", "Sexta" ou "Todos os dias".

ESTRUTURA JSON (Responda APENAS o JSON válido):
{
  "numAulasDia": 6,
  "horarios": ["7h - 7h45", "7h45 - 8h30", "8h50 - 9h35", "9h35 - 10h20", "10h20 - 11h05", "11h05 - 11h50"],
  "materias": [
    {
      "sigla": "Port",
      "professores": [
        {
          "nome": "Juliana",
          "turmas": [{ "nome": "6A", "aulas": 5 }],
          "indisponibilidades": [{ "dia": "Segunda", "hora": "10h20 - 11h05" }]
        }
      ]
    }
  ]
}

Entrada do usuário:
${aiText}`;

                const aiResponseText = await callCohere(prompt);
                if (aiResponseText) {
                    const json = extractJSON(aiResponseText);
                    
                    let parsedNumAulas = 6;
                    let parsedHorarios = [];
                    if (json) {
                        parsedNumAulas = parseInt(json.numAulasDia || json.aulasPorDia || (json.horarios ? json.horarios.length : 6)) || 6;
                        parsedHorarios = Array.isArray(json.horarios) && json.horarios.length > 0 ? json.horarios : [];
                    }
                    
                    if (parsedHorarios.length === 0) {
                        parsedHorarios = Array.from({ length: parsedNumAulas }, (_, i) => `${i + 1}ª Aula`);
                    } else if (parsedHorarios.length !== parsedNumAulas) {
                        parsedNumAulas = parsedHorarios.length;
                    }

                    const processedMaterias = convertAnyJsonToMaterias(json, parsedHorarios);

                    if (processedMaterias && processedMaterias.length > 0) {
                        setNumAulasDia(parsedNumAulas);
                        setHorarios(parsedHorarios);
                        setMaterias(processedMaterias);
                        setStep(2);
                        setIsAiInputOpen(false);
                        setAiText("");
                    } else {
                        alert("Não foi possível mapear os dados da resposta da IA. Verifique se o texto descreve as matérias e professores com clareza.");
                    }
                }
                setAiLoading(false);
            };

            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setAiLoading(true);
                setAiStatus("Executando OCR local (Tesseract)...");
                try {
                    const { data: { text } } = await Tesseract.recognize(file, 'por');
                    setAiText(prev => prev + "\n[Texto processado da imagem]:\n" + text);
                } catch (error) {
                    alert("Ocorreu um erro ao ler o arquivo: " + error.message);
                }
                setAiLoading(false);
                setAiStatus("");
            };

            const reviewGridOptimizations = async () => {
                setAiLoading(true);
                setAiStatus("Analisando heurística de distribuição...");
                
                const prompt = `Avalie a grade escolar fornecida abaixo. Identifique oportunidades de melhoria na distribuição das aulas na semana, garantindo que nenhum professor fique agendado duas vezes no mesmo horário e mantendo o número total de aulas inalterado.

                Grade Atual: ${JSON.stringify(grade)}

                const aiResponseText = await callCohere(prompt);
                if (aiResponseText) {
                    const json = extractJSON(aiResponseText);
                    let isValid = true;

                    else {
                        for (let t of turmasDisponiveis) {

                    if (isValid) {
                        setGrade(json);

                    } else {
                        alert("A requisição retornou um formato inválido. Nenhuma alteração aplicada.");
                    }

                setAiLoading(false);
                setAiStatus("");

            const handleDragStart = (e, turma, dia, hora, aula) => setDraggedItem({ turma, dia, hora, aula });

                                            <div className="flex justify-between items-center text-[11px] mb-1 font-semibold">

                                                    {apiLimits.percent}% ({apiLimits.remaining}/{apiLimits.limit})

                                                <div 
                                                    className={`h-full rounded-full transition-all duration-500 ${apiLimits.percent > 40 ? 'bg-gradient-to-r from-purple-500 to-fuchsia-400' : (apiLimits.percent > 15 ? 'bg-amber-400' : 'bg-red-500')}`}
                                                    style={{ width: `${apiLimits.percent}%` }}
                                                ></div>

                                        </div>
                                        <div className="h-7 w-px bg-purple-900/40 hidden md:block"></div>
                                        <div className="hidden md:flex flex-col text-right text-[11px]">

                                            <span className="text-purple-200 font-bold">{apiLimits.tokensUsed} tokens</span>

                                    <textarea value={aiText} onChange={(e) => setAiText(e.target.value)} placeholder="Insira o texto bruto aqui..." className="w-full flex-1 min-h-[160px] p-4 bg-[#0b0710] border border-purple-900/50 rounded-lg focus:border-purple-600 focus:outline-none text-sm text-gray-300 mb-4 resize-none transition-colors"></textarea>
                                    
                                    {aiLoading && (

                                    <div className="flex justify-end space-x-3 mt-auto">
                                        <button onClick={() => setIsAiInputOpen(false)} disabled={aiLoading} className="px-4 py-2 rounded-lg text-sm text-gray-400 hover:text-gray-200 transition-colors">Cancelar</button>
                                        <button onClick={handleGenerateFromData} disabled={aiLoading || !aiText} className="bg-purple-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-purple-500 transition-colors disabled:opacity-50">
                                            Processar Dados
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Breadcrumbs Navigation */}
                        <div className="flex bg-[#0d0914] border-b border-purple-900/30">
                            <div className={`flex-1 text-center py-3 text-xs tracking-wide font-medium transition-colors ${step === 1 ? 'border-b-2 border-purple-500 text-purple-300 bg-[#160f22]' : 'text-gray-500'}`}>ESTRUTURA DE TEMPO</div>
                            <div className={`flex-1 text-center py-3 text-xs tracking-wide font-medium transition-colors ${step === 2 ? 'border-b-2 border-purple-500 text-purple-300 bg-[#160f22]' : 'text-gray-500'}`}>RECURSOS E DEMANDAS</div>
                            <div className={`flex-1 text-center py-3 text-xs tracking-wide font-medium transition-colors ${step === 3 ? 'border-b-2 border-purple-500 text-purple-300 bg-[#160f22]' : 'text-gray-500'}`}>QUADRO DE ALOCAÇÃO</div>
                        </div>

                        <div className="p-6 sm:p-10">
                            
                            {(step === 1 || step === 2) && (
                                <div className="flex flex-wrap items-center justify-between gap-3 mb-6 bg-[#160f22] p-3 rounded-xl border border-purple-900/30">
                                    <div className="flex flex-wrap items-center gap-2">
                                        <button onClick={salvarConfiguracao} className="text-xs font-semibold bg-[#181124] text-purple-300 border border-purple-800/40 px-3.5 py-2 rounded-lg hover:bg-[#251a35] transition-colors flex items-center shadow-sm">
                                            <i className="fa-solid fa-floppy-disk mr-1.5 text-purple-400"></i> Salvar Recursos e Demandas
                                        </button>
                                        <button onClick={carregarConfiguracao} className="text-xs font-semibold bg-[#181124] text-purple-300 border border-purple-800/40 px-3.5 py-2 rounded-lg hover:bg-[#251a35] transition-colors flex items-center shadow-sm">
                                            <i className="fa-solid fa-bolt mr-1.5 text-amber-400"></i> Carregar Dados Salvos
                                        </button>
                                        <button onClick={exportarConfiguracaoJSON} className="text-xs text-gray-400 hover:text-gray-200 px-3 py-2 rounded-lg transition-colors flex items-center border border-purple-900/20">
                                            <i className="fa-solid fa-download mr-1.5"></i> Exportar JSON
                                        </button>
                                        <button onClick={() => jsonFileInputRef.current.click()} className="text-xs text-gray-400 hover:text-gray-200 px-3 py-2 rounded-lg transition-colors flex items-center border border-purple-900/20">
                                            <i className="fa-solid fa-file-import mr-1.5"></i> Carregar JSON
                                        </button>
                                        <input type="file" accept=".json" ref={jsonFileInputRef} onChange={importarConfiguracaoJSON} className="hidden" />
                                    </div>

                                    <button onClick={() => setIsAiInputOpen(true)} className="text-xs font-semibold bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-500 transition-colors flex items-center shadow-md ml-auto">
                                        <i className="fa-solid fa-wand-magic-sparkles mr-2"></i> Importação Expressa
                                    </button>
                                </div>
                            )}

                            {/* STEP 1 */}
                            {step === 1 && (
                                <div className="fade-in space-y-6 max-w-4xl">
                                    <div>
                                        <h2 className="text-lg font-semibold text-gray-200 mb-1">Definição de Parâmetros</h2>
                                        <p className="text-sm text-gray-500 mb-6">Ajuste as métricas de tempo diárias para todas as instâncias de classe.</p>
                                    </div>
                                    <div className="bg-[#181124] p-6 rounded-xl border border-purple-900/20">
                                        <label className="block text-sm font-medium text-gray-400 mb-2">Períodos letivos por dia (Carga horária diária)</label>
                                        <input type="number" min="1" value={numAulasDia} onChange={(e) => changeNumAulas(e.target.value)} className="w-full sm:w-48 px-3 py-2 bg-[#0b0710] border border-purple-900/50 rounded-lg focus:border-purple-500 focus:outline-none text-sm text-gray-200" />
                                    </div>
                                    <div className="bg-[#181124] p-6 rounded-xl border border-purple-900/20">
                                        <label className="block text-sm font-medium text-gray-400 mb-4">Rotulagem dos blocos de tempo (Início das aulas)</label>
                                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                            {horarios.map((h, i) => (
                                                <div key={i}>
                                                    <span className="block text-xs text-gray-500 mb-1">Bloco {i + 1}</span>
                                                    <input type="text" value={h} onChange={(e) => updateHorario(i, e.target.value)} className="w-full px-3 py-2 bg-[#0b0710] border border-purple-900/50 rounded-lg text-sm text-center text-gray-200 focus:border-purple-500 focus:outline-none" />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="pt-6 flex justify-end">
                                        <button onClick={() => setStep(2)} className="bg-purple-600 text-white px-6 py-2.5 rounded-lg text-sm font-medium hover:bg-purple-500 transition-colors">
                                            Avançar para Recursos
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* STEP 2 */}
                            {step === 2 && (
                                <div className="fade-in space-y-6">
                                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center">
                                        <div>
                                            <h2 className="text-lg font-semibold text-gray-200 mb-1">Inventário e Restrições</h2>
                                            <p className="text-sm text-gray-500 mb-2 sm:mb-0">Mapeamento de docentes, disciplinas e bloqueios de agenda.</p>
                                        </div>
                                        <button onClick={addMateria} className="bg-[#1c1328] text-purple-300 border border-purple-800/40 px-4 py-2 rounded-lg text-sm hover:bg-[#251a35] transition-colors">
                                            <i className="fa-solid fa-plus mr-1.5"></i> Nova Disciplina
                                        </button>
                                    </div>

                                    {materias.length === 0 && (
                                        <div className="text-center py-12 bg-[#130d1b] border border-dashed border-purple-900/50 rounded-xl text-gray-500 text-sm">
                                            O diretório está vazio. Utilize o botão acima para inserir uma disciplina.
                                        </div>
                                    )}

                                    <div className="space-y-5">
                                        {materias.map((mat, matIdx) => (
                                            <div key={mat.id} className="border border-purple-900/30 rounded-xl p-5 bg-[#181124] relative">
                                                <button onClick={() => removeMateria(matIdx)} className="absolute top-5 right-5 text-gray-500 hover:text-red-400 transition-colors p-1"><i className="fa-regular fa-trash-can"></i></button>
                                                
                                                <div className="flex flex-col sm:flex-row sm:items-center space-y-1 sm:space-y-0 sm:space-x-3 mb-5">
                                                    <label className="text-sm font-medium text-gray-300">Identificador (Disciplina):</label>
                                                    <input type="text" value={mat.sigla} onChange={(e) => updateMateria(matIdx, e.target.value)} className="w-full sm:w-48 px-3 py-1.5 bg-[#0b0710] border border-purple-900/50 rounded-md focus:outline-none focus:border-purple-500 text-sm text-gray-200" placeholder="Ex: MAT" />
                                                </div>

                                                <div className="pl-0 sm:pl-4 border-l-2 border-purple-900/30 space-y-4">
                                                    {mat.professores.map((prof, profIdx) => (
                                                        <div key={prof.id} className="bg-[#130d1b] border border-purple-900/20 rounded-lg p-4 relative">
                                                            <button onClick={() => removeProfessor(matIdx, profIdx)} className="absolute top-4 right-4 text-gray-600 hover:text-red-400 transition-colors"><i className="fa-solid fa-xmark"></i></button>
                                                            
                                                            <div className="flex flex-col sm:flex-row sm:items-center space-y-1 sm:space-y-0 sm:space-x-3 mb-4">
                                                                <label className="text-xs font-medium text-gray-400">Docente:</label>
                                                                <input type="text" value={prof.nome} onChange={(e) => updateProfessor(matIdx, profIdx, e.target.value)} className="w-full sm:w-64 px-3 py-1.5 bg-[#0b0710] border border-purple-900/50 rounded-md text-sm text-gray-200 focus:outline-none focus:border-purple-500" placeholder="Nome" />
                                                            </div>

                                                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                                                <div className="bg-[#181124] p-3 rounded-lg border border-purple-900/20">
                                                                    <div className="flex justify-between items-center mb-3">
                                                                        <span className="text-xs font-medium text-gray-400 uppercase tracking-wide">Turmas e Carga</span>
                                                                        <button onClick={() => addTurmaAoProfessor(matIdx, profIdx)} className="text-[10px] uppercase font-bold text-purple-400 hover:text-purple-300 transition-colors">Adicionar Registro</button>
                                                                    </div>
                                                                    <div className="space-y-2">
                                                                        {prof.turmas.map((turma, turmaIdx) => (
                                                                            <div key={turma.id} className="flex space-x-2 items-center">
                                                                                <input type="text" placeholder="ID Turma" value={turma.nome} onChange={(e) => updateTurma(matIdx, profIdx, turmaIdx, 'nome', e.target.value)} className="w-1/2 px-2 py-1.5 bg-[#0b0710] border border-purple-900/50 rounded text-xs text-gray-300 focus:outline-none focus:border-purple-500" />
                                                                                <input type="number" min="1" placeholder="Aulas" value={turma.aulas} onChange={(e) => updateTurma(matIdx, profIdx, turmaIdx, 'aulas', e.target.value)} className="w-1/3 px-2 py-1.5 bg-[#0b0710] border border-purple-900/50 rounded text-xs text-center text-gray-300 focus:outline-none focus:border-purple-500" />
                                                                                <button onClick={() => removeTurma(matIdx, profIdx, turmaIdx)} className="text-gray-500 hover:text-red-400"><i className="fa-regular fa-trash-can text-sm"></i></button>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                                <div className="bg-[#181124] p-3 rounded-lg border border-purple-900/20">
                                                                    <div className="flex justify-between items-center mb-3">
                                                                        <span className="text-xs font-medium text-gray-400 uppercase tracking-wide">Bloqueios de Agenda</span>
                                                                        <button onClick={() => addIndisponibilidade(matIdx, profIdx)} className="text-[10px] uppercase font-bold text-orange-400 hover:text-orange-300 transition-colors">Inserir Bloqueio</button>
                                                                    </div>
                                                                    <div className="space-y-2">
                                                                        {prof.indisponibilidades.map((ind, indIdx) => (
                                                                            <div key={ind.id} className="flex space-x-2 items-center">
                                                                                <select value={ind.dia} onChange={(e) => updateIndisponibilidade(matIdx, profIdx, indIdx, 'dia', e.target.value)} className="w-1/2 px-2 py-1.5 bg-[#0b0710] border border-purple-900/50 rounded text-xs text-gray-300 focus:outline-none focus:border-purple-500">
                                                                                    {DIAS.map(d => <option key={d} value={d}>{d}</option>)}
                                                                                </select>
                                                                                <select value={ind.hora} onChange={(e) => updateIndisponibilidade(matIdx, profIdx, indIdx, 'hora', e.target.value)} className="w-1/2 px-2 py-1.5 bg-[#0b0710] border border-purple-900/50 rounded text-xs text-gray-300 focus:outline-none focus:border-purple-500">
                                                                                    {horarios.map(h => <option key={h} value={h}>{h || '-'}</option>)}
                                                                                </select>
                                                                                <button onClick={() => removeIndisponibilidade(matIdx, profIdx, indIdx)} className="text-gray-500 hover:text-red-400"><i className="fa-regular fa-trash-can text-sm"></i></button>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                    <button onClick={() => addProfessor(matIdx)} className="mt-2 text-xs font-medium text-purple-400 hover:text-purple-300 transition-colors">
                                                        + Adicionar Novo Docente
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    
                                    {erroGeracao && <div className="bg-red-900/20 border border-red-900/50 text-red-400 px-4 py-3 rounded-lg text-sm mt-6">Aviso do Sistema: {erroGeracao}</div>}

                                    <div className="pt-8 flex justify-between items-center">
                                        <button onClick={() => setStep(1)} className="text-gray-400 hover:text-gray-200 text-sm px-4 py-2">Retornar</button>
                                        <div className="flex space-x-3">
                                            <button onClick={salvarConfiguracao} className="text-purple-300 bg-[#1c1328] border border-purple-800/40 hover:bg-[#251a35] px-4 py-2.5 rounded-lg text-sm transition-colors flex items-center shadow-sm">
                                                <i className="fa-solid fa-floppy-disk mr-2 text-purple-400"></i> Salvar Demandas
                                            </button>
                                            <button onClick={gerarGrade} disabled={isGenerating} className={`text-white px-6 py-2.5 rounded-lg text-sm font-medium transition-all ${isGenerating ? 'bg-purple-900/50 cursor-not-allowed' : 'bg-purple-600 hover:bg-purple-500 shadow-lg'}`}>
                                                {isGenerating ? 'Compilando Grade...' : 'Compilar Grade Curricular'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* STEP 3 */}
                            {step === 3 && grade && (
                                <div className="fade-in space-y-6">
                                    <div className="bg-[#181124] border border-purple-900/30 p-4 rounded-lg flex items-start space-x-3 mb-6">
                                        <i className="fa-solid fa-circle-info text-purple-400 mt-0.5"></i>
                                        <div>
                                            <p className="text-sm text-gray-300 leading-relaxed">Grade compilada sem conflitos matemáticos. Alterações manuais (Drag & Drop) são restritas à mesma turma para preservar a integridade estrutural.</p>
                                        </div>
                                    </div>

                                    <div className="flex flex-col sm:flex-row justify-between items-center pb-4">
                                        <h2 className="text-lg font-semibold text-gray-200">Relatório Analítico</h2>
                                        
                                        <div className="flex space-x-2 mt-4 sm:mt-0">
                                            <button onClick={reviewGridOptimizations} disabled={aiLoading} className="text-sm bg-[#1c1328] hover:bg-[#251a35] text-purple-300 border border-purple-800/40 px-4 py-2 rounded-lg transition-colors no-print">
                                                {aiLoading ? 'Processando...' : 'Avaliação Heurística'}
                                            </button>
                                            <button onClick={exportToCSV} className="text-sm bg-[#182a20] hover:bg-[#1d3326] text-emerald-400 border border-emerald-900/50 px-4 py-2 rounded-lg transition-colors no-print">
                                                Exportar CSV
                                            </button>
                                            <button onClick={() => window.print()} className="text-sm bg-[#222] hover:bg-[#333] text-gray-300 border border-gray-700 px-4 py-2 rounded-lg transition-colors no-print">
                                                Imprimir
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div id="printable-area" className="space-y-8">
                                        {turmasDisponiveis.map(turma => (
                                            <div key={turma} className="bg-[#181124] print-bg-dark border border-purple-900/20 rounded-xl overflow-hidden print-border">
                                                <div className="bg-[#100b17] print-bg-dark px-4 py-3 text-sm font-semibold text-gray-200 print-text-dark border-b border-purple-900/20 uppercase tracking-wide">Identificador: {turma}</div>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm text-left">
                                                        <thead className="bg-[#130d1b] text-gray-400 font-medium uppercase text-xs border-b border-purple-900/20 print-bg-dark">
                                                            <tr>
                                                                <th className="px-4 py-3 w-24 border-r border-purple-900/10">Bloco</th>
                                                                {DIAS.map(d => <th key={d} className="px-4 py-3 w-[16%]">{d}</th>)}
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-purple-900/10">
                                                            {horarios.map(hora => (
                                                                <tr key={hora}>
                                                                    <td className="px-4 py-3 text-xs text-gray-500 bg-[#100b17]/50 border-r border-purple-900/10 print-bg-dark">{hora}</td>
                                                                    {DIAS.map(dia => {
                                                                        const aula = grade[turma][dia][hora];
                                                                        const isVago = aula === "—";
                                                                        const isDragOver = dragOverItem && dragOverItem.turma === turma && dragOverItem.dia === dia && dragOverItem.hora === hora;
                                                                        return (
                                                                            <td key={dia} draggable="true" onDragStart={(e) => handleDragStart(e, turma, dia, hora, aula)} onDragOver={(e) => handleDragOver(e, turma, dia, hora)} onDragLeave={() => setDragOverItem(null)} onDrop={(e) => handleDrop(e, turma, dia, hora)} className={`px-4 py-3 border-r border-purple-900/10 draggable-cell transition-colors ${isVago ? 'text-gray-600 bg-transparent' : 'text-gray-300 bg-[#1c1328] hover:bg-[#251a35]'} ${isDragOver ? 'drag-over' : ''}`}>
                                                                                <div className="flex items-center justify-between group">
                                                                                    <span>{isVago ? 'Vago' : aula}</span>
                                                                                    {!isVago && <i className="fa-solid fa-grip-vertical text-gray-600 opacity-0 group-hover:opacity-100 transition-opacity no-print"></i>}
                                                                                </div>
                                                                            </td>
                                                                        );
                                                                    })}
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mt-8 pt-6 border-t border-purple-900/30 flex justify-start no-print">
                                        <button onClick={() => setStep(2)} className="text-sm text-gray-400 hover:text-gray-200 px-4 py-2 transition-colors">
                                            &larr; Revisar Mapeamentos
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
